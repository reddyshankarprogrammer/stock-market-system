server:
  port: ${MARKET_DATA_SERVICE_PORT:8082}

spring:
  application:
    name: market-data-service
  # Load the shared .env at the repo root (works when started from the service dir or the repo root).
  # Real environment variables still take precedence over these values.
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]

  # .env host names (mysql, redis, kafka) only resolve inside the docker network,
  # so the default profile targets the ports published on localhost.
  datasource:
    url: jdbc:mysql://localhost:${MYSQL_PORT:3306}/${MYSQL_DATABASE}?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_ROOT_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  data:
    redis:
      host: localhost
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: localhost:${KAFKA_PORT:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer



market:
    price-update-interval: 60000

---
# Running inside docker-compose on trading-network: use the container host names from .env.
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
  data:
    redis:
      host: ${REDIS_HOST}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
