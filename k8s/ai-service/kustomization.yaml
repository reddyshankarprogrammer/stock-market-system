apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: stock-market
# secret.yaml is a template: the Secret is created by scripts/create-secrets.sh.
# hpa.yaml is added when the service is enabled (deployment.yaml, step 3): an HPA whose target
# has 0 replicas reports "ScalingDisabled", which Argo CD would show as a degraded application.
resources:
  - serviceaccount.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - pdb.yaml
labels:
  - pairs:
      app.kubernetes.io/managed-by: argocd
    includeSelectors: false
# The image tag is the deployed version. It is changed only by the CD workflow
# (.github/workflows/cd.yml) through an approved pull request.
images:
  - name: ghcr.io/reddyshankarprogrammer/ai-service
    newTag: main
