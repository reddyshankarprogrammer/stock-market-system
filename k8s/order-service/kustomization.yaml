apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: stock-market
# secret.yaml is a template: the Secret is created by scripts/create-secrets.sh.
resources:
  - serviceaccount.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
labels:
  - pairs:
      app.kubernetes.io/managed-by: argocd
    includeSelectors: false
# The image tag is the deployed version. It is changed only by the CD workflow
# (.github/workflows/cd.yml) through an approved pull request.
images:
  - name: ghcr.io/reddyshankarprogrammer/order-service
    newTag: main
