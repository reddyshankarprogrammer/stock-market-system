# Helm values for Loki (community chart grafana-community/loki), single-binary ("Monolithic")
# mode with filesystem storage on a local-path volume: right-sized for one K3s node.
# For multi-node / higher volume switch to SimpleScalable with S3-compatible object storage.
deploymentMode: Monolithic

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2026-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    # Business ids (userId, accountId, tradeId, statementId) are stored as structured metadata,
    # not as labels: they are searchable without creating one stream per id.
    allow_structured_metadata: true
    volume_enabled: true
    retention_period: 720h          # 30 days
    max_query_lookback: 720h
    ingestion_rate_mb: 8
    ingestion_burst_size_mb: 16
    max_global_streams_per_user: 10000
    reject_old_samples: true
    reject_old_samples_max_age: 168h
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
    working_directory: /var/loki/compactor
  pattern_ingester:
    enabled: true
  ruler:
    enable_api: true

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: local-path
    size: 30Gi
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi

# Monolithic mode: no distributed components.
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomCompactor:
  replicas: 0
bloomGateway:
  replicas: 0

# Single entry point used by Alloy (push) and Grafana (query): http://loki-gateway.logging.svc.
gateway:
  enabled: true
  replicas: 1

minio:
  enabled: false

chunksCache:
  enabled: false
resultsCache:
  enabled: false

lokiCanary:
  enabled: false
test:
  enabled: false

monitoring:
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack
