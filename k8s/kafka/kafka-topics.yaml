# Every Kafka topic of the platform, reconciled by the Strimzi Topic Operator.
# auto.create.topics.enable is false: a topic must be declared here before a service uses it.
# Payloads are flat JSON maps (root CLAUDE.md rule 6). See docs/kafka-topology.md.
#
# Group 1 - topics the services use today (names must match the services' application.yaml).
# Group 2 - domain-event topics reserved for the account / statement / trade / portfolio
#           event model; no producer or consumer exists yet.
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: user.registered
  namespace: messaging
  labels:
    strimzi.io/cluster: stock-market-kafka
    app.kubernetes.io/part-of: stock-market-system
    stock-market/topic-status: active
  annotations:
    stock-market/description: "user-service -> notification-service"
    # Removing a topic from Git must not delete it and its data: delete topics deliberately.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  topicName: user.registered
  partitions: 3
  replicas: 1
  config:
    retention.ms: 2592000000
    cleanup.policy: delete
    min.insync.replicas: 1
    compression.type: producer
---
