# Price cache for market-data-service.
# Valkey (BSD-3, Linux Foundation fork of Redis 7.2) is wire-compatible with the Redis client
# used by Spring Data Redis; Redis 7.4+ is no longer under an OSI open-source license.
# Password: Secret redis-secret (key REDIS_PASSWORD), created by scripts/create-secrets.sh.
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: database
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: stock-market-system
data:
  valkey.conf: |
    bind 0.0.0.0
    protected-mode yes
    port 6379
    dir /data
    appendonly yes
    appendfsync everysec
    save 900 1
    save 300 100
    maxmemory 384mb
    maxmemory-policy allkeys-lru
    tcp-keepalive 60
    timeout 0
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: database
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: stock-market-system
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: database
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: stock-market-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/component: cache
        app.kubernetes.io/part-of: stock-market-system
    spec:
      serviceAccountName: redis
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: valkey/valkey:8.1-alpine
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "exec valkey-server /etc/valkey/valkey.conf --requirepass \"$REDIS_PASSWORD\""]
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_PASSWORD
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            exec:
              command: ["sh", "-c", "REDISCLI_AUTH=\"$REDIS_PASSWORD\" valkey-cli ping | grep -q PONG"]
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            exec:
              command: ["sh", "-c", "REDISCLI_AUTH=\"$REDIS_PASSWORD\" valkey-cli ping | grep -q PONG"]
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["sh", "-c", "REDISCLI_AUTH=\"$REDIS_PASSWORD\" valkey-cli ping | grep -q PONG"]
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/valkey
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: redis-data
        - name: config
          configMap:
            name: redis-config
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: database
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: stock-market-system
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: redis
  namespace: database
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: stock-market-system
automountServiceAccountToken: false
