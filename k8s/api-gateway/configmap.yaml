apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: stock-market
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: stock-market-system
data:
  SPRING_PROFILES_ACTIVE: "docker"
  TZ: "UTC"
  LOG_LEVEL: "INFO"
  LOGGING_STRUCTURED_FORMAT_CONSOLE: "logstash"
  SERVER_SHUTDOWN: "graceful"
  SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: "25s"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,prometheus"
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: "never"
  MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED: "true"
  MANAGEMENT_METRICS_DISTRIBUTION_PERCENTILESHISTOGRAM_HTTP_SERVER_REQUESTS: "true"
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75 -XX:InitialRAMPercentage=50 -XX:+ExitOnOutOfMemoryError -XX:+UseG1GC"
  API_GATEWAY_PORT: "8080"
  MANAGEMENT_METRICS_TAGS_APPLICATION: "api-gateway"
  HOSTS_USER_SERVICE: "user-service.stock-market.svc.cluster.local"
  USER_SERVICE_PORT: "8081"
  HOSTS_MARKET_DATA_SERVICE: "market-data-service.stock-market.svc.cluster.local"
  MARKET_DATA_SERVICE_PORT: "8082"
  HOSTS_ORDER_SERVICE: "order-service.stock-market.svc.cluster.local"
  ORDER_SERVICE_PORT: "8083"
  HOSTS_PORTFOLIO_SERVICE: "portfolio-service.stock-market.svc.cluster.local"
  PORTFOLIO_SERVICE_PORT: "8084"
  HOSTS_NOTIFICATION_SERVICE: "notification-service.stock-market.svc.cluster.local"
  NOTIFICATION_SERVICE_PORT: "8085"
  HOSTS_ACCOUNT_SERVICE: "account-service.stock-market.svc.cluster.local"
  ACCOUNT_SERVICE_PORT: "8086"
  JWT_ISSUER: "stock-market-system"
