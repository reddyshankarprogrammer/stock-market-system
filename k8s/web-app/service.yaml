apiVersion: v1
kind: Service
metadata:
  name: web-app
  namespace: stock-market
  labels:
    app.kubernetes.io/name: web-app
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: stock-market-system
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: web-app
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
