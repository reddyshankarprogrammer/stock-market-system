apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
  namespace: stock-market
  labels:
    app.kubernetes.io/name: web-app
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: stock-market-system
  annotations:
    stock-market/description: "Quantiva web app (Next.js): pages and the /api/auth, /api/onboarding route handlers that call the gateway. Tokens live only in httpOnly cookies."
spec:
  # replicas is owned by the HorizontalPodAutoscaler (hpa.yaml); Argo CD ignores the field.
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 300
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: web-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web-app
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: stock-market-system
      annotations:
        kubectl.kubernetes.io/default-container: web-app
    spec:
      serviceAccountName: web-app
      automountServiceAccountToken: false
      # Service links would inject e.g. API_GATEWAY_PORT=tcp://10.43.x.x:8080 into the pod environment.
      enableServiceLinks: false
      priorityClassName: stock-market-service
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: web-app
      containers:
        - name: web-app
          image: ghcr.io/reddyshankarprogrammer/web-app:main
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: web-app-config
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop: ["ALL"]
          # /api/health does not call the gateway: a gateway outage must not restart or unready the web pods.
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            # Let the Service endpoints and ingress drop the pod before Node stops accepting.
            preStop:
              sleep:
                seconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/.next/cache
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: next-cache
          emptyDir:
            sizeLimit: 256Mi
