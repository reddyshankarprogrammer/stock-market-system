# TEMPLATE ONLY: never commit real values and never add this file to kustomization.yaml.
# The live Secret is created from the repo-root .env by scripts/create-secrets.sh (values never
# touch Git). Argo CD does not manage Secrets (AppProject blacklist), so a sync never overwrites them.
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: database
  labels:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/part-of: stock-market-system
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: REPLACE_ME            # .env MYSQL_ROOT_PASSWORD
  MYSQL_DATABASE: stock_market_system_db     # .env MYSQL_DATABASE
  MYSQL_USER: stockmarket                    # .env MYSQL_APP_USERNAME (application account)
  MYSQL_PASSWORD: REPLACE_ME                 # .env MYSQL_APP_PASSWORD
  MYSQL_EXPORTER_PASSWORD: REPLACE_ME        # .env MYSQL_EXPORTER_PASSWORD (Prometheus exporter, read-only)
