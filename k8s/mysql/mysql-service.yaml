apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: database
  labels:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/part-of: stock-market-system
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
    - name: metrics
      port: 9104
      targetPort: metrics
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mysql
  namespace: database
  labels:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/part-of: stock-market-system
automountServiceAccountToken: false
