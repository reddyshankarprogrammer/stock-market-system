apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: portfolio-service
  namespace: stock-market
  labels:
    app.kubernetes.io/name: portfolio-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: stock-market-system
spec:
  # maxUnavailable (not minAvailable) so single-replica services never block a node drain.
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: portfolio-service
