apiVersion: v1
kind: Service
metadata:
  name: portfolio-service
  namespace: stock-market
  labels:
    app.kubernetes.io/name: portfolio-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: stock-market-system
    monitoring.stock-market/scrape: "true"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: portfolio-service
  ports:
    - name: http
      port: 8084
      targetPort: http
      protocol: TCP
