metadata:
  name: operators
  namespace: database
  labels:
    app.kubernetes.io/part-of: stock-market-system
subjects:
  - kind: Group
    name: stock-market:operators
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: stock-market-operator
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: operators
  namespace: messaging
  labels:
    app.kubernetes.io/part-of: stock-market-system
subjects:
  - kind: Group
    name: stock-market:operators
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: stock-market-operator
  apiGroup: rbac.authorization.k8s.io
