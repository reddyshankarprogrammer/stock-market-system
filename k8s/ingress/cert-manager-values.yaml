# Helm values for cert-manager (chart jetstack/cert-manager), installed into the platform
# namespace by scripts/install-ingress.sh. ClusterIssuer secrets live in that namespace too.
crds:
  enabled: true
  keep: true

global:
  leaderElection:
    namespace: platform

replicaCount: 1

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

webhook:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

cainjector:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# Renew certificates when 1/3 of the lifetime is left (cert-manager default) and expose
# certmanager_certificate_expiration_timestamp_seconds for the CertificateExpiringSoon alert.
prometheus:
  enabled: true
  servicemonitor:
    # Switched on by scripts/install-ingress.sh once the Prometheus Operator CRDs exist.
    enabled: false
    labels:
      release: kube-prometheus-stack
