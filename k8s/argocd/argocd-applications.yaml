# Argo CD applications of the stock-market platform (GitOps: Git branch main -> cluster).
#
# Created by the root application (root-application.yaml), which syncs this file and
# project.yaml. Each application reconciles one folder under k8s/. Sync waves order the first
# install (Argo CD waits until an application is Healthy before the next wave):
#   -10 namespaces    -9 security    -5 mysql, redis, kafka    -3 ingress, monitoring
#     0 application services
#
# Production gate: these applications sync automatically, but main only changes through
# reviewed pull requests; the image tags in k8s/<service>/kustomization.yaml change only through
# the CD workflow after a required reviewer approves the "production" GitHub Environment.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: namespaces
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: stock-market
    stock-market/layer: foundation
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: stock-market
  source:
    repoURL: https://github.com/reddyshankarprogrammer/stock-market-system.git
    targetRevision: main
    path: k8s/namespaces
  destination:
    server: https://kubernetes.default.svc
    namespace: stock-market
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
  revisionHistoryLimit: 20
---
