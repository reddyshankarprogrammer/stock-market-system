apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
# kube-prometheus-stack-values.yaml is Helm input for scripts/install-monitoring.sh.
resources:
  - service-monitors.yaml
  - prometheus-rules.yaml

# Grafana dashboards (generated by dashboards/generate_dashboards.py), loaded by the
# Grafana sidecar from ConfigMaps labelled grafana_dashboard=1.
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: stock-market-system
  annotations:
    grafana_folder: Stock Market
configMapGenerator:
  - name: dashboard-services-overview
    files: [dashboards/stock-market-services-overview.json]
  - name: dashboard-api-gateway
    files: [dashboards/stock-market-api-gateway.json]
  - name: dashboard-user-service
    files: [dashboards/stock-market-user-service.json]
  - name: dashboard-account-service
    files: [dashboards/stock-market-account-service.json]
  - name: dashboard-portfolio-service
    files: [dashboards/stock-market-portfolio-service.json]
  - name: dashboard-order-service
    files: [dashboards/stock-market-order-service.json]
  - name: dashboard-market-data-service
    files: [dashboards/stock-market-market-data-service.json]
  - name: dashboard-notification-service
    files: [dashboards/stock-market-notification-service.json]
  - name: dashboard-kafka
    files: [dashboards/stock-market-kafka.json]
  - name: dashboard-mysql
    files: [dashboards/stock-market-mysql.json]
  - name: dashboard-cluster
    files: [dashboards/stock-market-cluster.json]
  - name: dashboard-logs
    files: [dashboards/stock-market-logs.json]
