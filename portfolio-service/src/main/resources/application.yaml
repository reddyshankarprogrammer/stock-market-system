server:
  port: ${PORTFOLIO_SERVICE_PORT:8084}

# Hosts of the infrastructure and downstream services.
# .env host names (mysql, kafka) only resolve inside the docker network,
# so the default profile targets localhost; the docker profile overrides these.
hosts:
  mysql: localhost
  kafka: localhost:${KAFKA_PORT:9092}
  market-data-service: localhost

spring:
  application:
    name: portfolio-service
  # Load the shared .env at the repo root (works when started from the service dir or the repo root).
  # Real environment variables still take precedence over these values.
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]

  datasource:
    url: jdbc:mysql://${hosts.mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE}?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_ROOT_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  kafka:
    bootstrap-servers: ${hosts.kafka}
    consumer:
      group-id: portfolio-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # ErrorHandlingDeserializer turns malformed JSON into a skipped record instead of a poison pill.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.use.type.headers: false
        spring.json.value.default.type: java.util.HashMap

# Base URLs for the Feign clients.
services:
  market-data:
    url: http://${hosts.market-data-service}:${MARKET_DATA_SERVICE_PORT:8082}

# Topics this service consumes.
kafka:
  topics:
    order-executed: order.executed

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info}
  endpoint:
    health:
      show-details: ${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:always}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.stockmarket.portfolioservice: DEBUG

---
# Running inside docker-compose on trading-network: use the container host names.
spring:
  config:
    activate:
      on-profile: docker

hosts:
  mysql: ${MYSQL_HOST}
  kafka: ${KAFKA_BOOTSTRAP_SERVERS}
  market-data-service: market-data-service
