# Continuous integration: build, test, analyse, scan and publish container images.
#
#   checkout -> Java 21 -> Maven build -> unit tests -> integration tests -> coverage (JaCoCo)
#   -> SonarQube -> OWASP Dependency-Check + Trivy + secret scan (security.yml)
#   -> Docker build -> Trivy image scan -> push to GHCR (main / develop only) -> notification
#
# A successful run on main triggers cd.yml, which proposes the production deployment.
# Pull requests and feature branches build and scan images but never push them.
name: CI

on:
  push:
    branches: [main, develop, "feature/**"]
    # Deployment commits from cd.yml only change image tags: no rebuild, no CD loop.
    paths-ignore:
      - "k8s/*/kustomization.yaml"
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - "k8s/*/kustomization.yaml"
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  JAVA_VERSION: "21"
  JACOCO_VERSION: "0.8.13"
  SONAR_MAVEN_PLUGIN_VERSION: "5.1.0.4751"
  TRIVY_VERSION: "0.71.1"
  KUBECONFORM_VERSION: "v0.6.7"
  # Images are pushed only for these branches.
  PUBLISH: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') }}

jobs:
  # --------------------------------------------------------------------------------------------
  build-test:
    name: Build & test · ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - user-service
          - market-data-service
          - order-service
          - portfolio-service
          - notification-service
          - account-service
    # market-data-service and portfolio-service contextLoads tests need MySQL, Redis and Kafka on
    # localhost; account-service starts its own MySQL + Kafka with Testcontainers.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: stock_market_system_db
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 5s --health-timeout 5s --health-retries 30
      redis:
        image: valkey/valkey:8.1-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
      kafka:
        image: apache/kafka:3.9.1
        ports: ["9092:9092"]
    env:
      # Same variable names as the repo-root .env (which is not committed).
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: stock_market_system_db
      MYSQL_USERNAME: root
      MYSQL_ROOT_PASSWORD: ci-root-password
      REDIS_PORT: "6379"
      KAFKA_PORT: "9092"
      # Test-only signing key, unrelated to any deployed environment.
      JWT_SECRET: ci-only-jwt-signing-key-0123456789abcdef0123456789abcdef
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history for SonarQube blame information

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      - name: Maven build
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp -DskipTests package

      - name: Unit tests
        run: |
          ./mvnw -B -ntp \
            "org.jacoco:jacoco-maven-plugin:${JACOCO_VERSION}:prepare-agent" \
            surefire:test \
            -Dtest='!*ApplicationTests,!*V2Tests' \
            -Dsurefire.failIfNoSpecifiedTests=false

      - name: Integration tests
        run: |
          ./mvnw -B -ntp \
            "org.jacoco:jacoco-maven-plugin:${JACOCO_VERSION}:prepare-agent" \
            surefire:test \
            -Dtest='*ApplicationTests,*V2Tests' \
            -Dsurefire.failIfNoSpecifiedTests=false

      - name: Code coverage
        if: always()
        run: |
          ./mvnw -B -ntp "org.jacoco:jacoco-maven-plugin:${JACOCO_VERSION}:report" || exit 0
          csv=target/site/jacoco/jacoco.csv
          if [[ -f "${csv}" ]]; then
            awk -F, 'NR>1 { missed+=$8; covered+=$9 } END {
              total = missed + covered
              pct = total ? 100 * covered / total : 0
              printf "### Coverage · %s\n\nLine coverage: **%.1f%%** (%d of %d lines)\n", ENVIRON["SERVICE"], pct, covered, total
            }' SERVICE="${{ matrix.service }}" "${csv}" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ matrix.service }}
          path: |
            ${{ matrix.service }}/target/surefire-reports/
            ${{ matrix.service }}/target/site/jacoco/
          retention-days: 14
          if-no-files-found: ignore

      - name: SonarQube analysis
        if: env.SONAR_TOKEN != ''
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_PREFIX: ${{ vars.SONAR_PROJECT_PREFIX || 'stock-market-system' }}
        run: |
          org_arg=()
          [[ -n "${SONAR_ORGANIZATION}" ]] && org_arg=(-Dsonar.organization="${SONAR_ORGANIZATION}")
          ./mvnw -B -ntp \
            "org.sonarsource.scanner.maven:sonar-maven-plugin:${SONAR_MAVEN_PLUGIN_VERSION}:sonar" \
            -Dsonar.host.url="${SONAR_HOST_URL}" \
            -Dsonar.token="${SONAR_TOKEN}" \
            "${org_arg[@]}" \
            -Dsonar.projectKey="${SONAR_PROJECT_PREFIX}_${{ matrix.service }}" \
            -Dsonar.projectName="${{ matrix.service }}" \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=300

      - name: SonarQube skipped
        if: env.SONAR_TOKEN == ''
        run: echo "::notice title=SonarQube::SONAR_TOKEN is not configured; analysis skipped (see docs/github-actions-guide.md)."

  # --------------------------------------------------------------------------------------------
  validate-manifests:
    name: Validate Kubernetes manifests and scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install kubeconform
        run: |
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kubeconform

      - name: Render and validate every kustomization
        run: |
          set -euo pipefail
          mkdir -p rendered
          for dir in k8s/*/; do
            name="$(basename "${dir}")"
            [[ -f "${dir}kustomization.yaml" ]] || continue
            kubectl kustomize "${dir}" > "rendered/${name}.yaml"
            # Secrets never live in Git (k8s/argocd/project.yaml blacklists them for Argo CD too).
            if grep -qE '^kind: Secret$' "rendered/${name}.yaml"; then
              echo "::error file=${dir}kustomization.yaml::${name} renders a Secret; use scripts/create-secrets.sh instead"
              exit 1
            fi
          done
          kubeconform -strict -summary -output pretty \
            -kubernetes-version 1.34.0 \
            -ignore-missing-schemas \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            rendered/*.yaml k8s/argocd/project.yaml k8s/argocd/argocd-applications.yaml k8s/argocd/root-application.yaml

      - name: Dashboards are up to date
        run: |
          python3 k8s/monitoring/dashboards/generate_dashboards.py
          git diff --exit-code -- k8s/monitoring/dashboards \
            || { echo "::error::Run python k8s/monitoring/dashboards/generate_dashboards.py and commit the result"; exit 1; }

      - name: ShellCheck
        run: shellcheck -x -S warning scripts/*.sh scripts/lib/*.sh

  # --------------------------------------------------------------------------------------------
  security:
    name: Security
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write
    secrets: inherit

  # --------------------------------------------------------------------------------------------
  docker:
    name: Image · ${{ matrix.service }}
    needs: [build-test, validate-manifests, security]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      id-token: write          # keyless cosign signature
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - user-service
          - market-data-service
          - order-service
          - portfolio-service
          - notification-service
          - account-service
          - ai-service
    env:
      SERVICE: ${{ matrix.service }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check buildable
        id: check
        run: |
          # ai-service is a placeholder until it has a requirements.txt (ai-service/Dockerfile).
          if [[ ! -f "${SERVICE}/Dockerfile" ]] || [[ "${SERVICE}" == "ai-service" && ! -f ai-service/requirements.txt ]]; then
            echo "build=false" >> "${GITHUB_OUTPUT}"
            echo "::notice title=${SERVICE}::not buildable yet, skipped"
          else
            echo "build=true" >> "${GITHUB_OUTPUT}"
          fi
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${SERVICE}" >> "${GITHUB_OUTPUT}"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        if: steps.check.outputs.build == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Image metadata
        if: steps.check.outputs.build == 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.check.outputs.image }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image
        if: steps.check.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service }}
          load: true
          push: false
          tags: local/${{ matrix.service }}:scan
          build-args: |
            BUILD_VERSION=${{ github.ref_name }}
            BUILD_REVISION=${{ github.sha }}
            BUILD_DATE=${{ steps.check.outputs.created }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

      - name: Trivy image scan
        if: steps.check.outputs.build == 'true'
        run: |
          mkdir -p "${HOME}/.cache/trivy" trivy
          trivy() {
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "${HOME}/.cache/trivy:/root/.cache/trivy" \
              -v "${PWD}/trivy:/out" \
              "aquasec/trivy:${TRIVY_VERSION}" "$@"
          }
          trivy image --scanners vuln --format sarif --output /out/image.sarif "local/${SERVICE}:scan"
          # Gate: fixable HIGH / CRITICAL vulnerabilities fail the build.
          trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --format table "local/${SERVICE}:scan"

      - name: Upload Trivy results to code scanning
        if: always() && steps.check.outputs.build == 'true' && hashFiles('trivy/image.sarif') != ''
        continue-on-error: true   # code scanning needs a public repo or GitHub Advanced Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy/image.sarif
          category: trivy-image-${{ matrix.service }}

      - name: Log in to GHCR
        if: steps.check.outputs.build == 'true' && env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: steps.check.outputs.build == 'true' && env.PUBLISH == 'true'
        id: push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ github.ref_name }}
            BUILD_REVISION=${{ github.sha }}
            BUILD_DATE=${{ steps.check.outputs.created }}
          cache-from: type=gha,scope=${{ matrix.service }}
          provenance: mode=max
          sbom: true

      - name: Install cosign
        if: steps.push.outcome == 'success'
        uses: sigstore/cosign-installer@v3

      - name: Sign image (cosign keyless)
        if: steps.push.outcome == 'success'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE: ${{ steps.check.outputs.image }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          echo "Pushed and signed \`${IMAGE}@${DIGEST}\`" >> "${GITHUB_STEP_SUMMARY}"

  # --------------------------------------------------------------------------------------------
  notify:
    name: Build status notification
    needs: [build-test, validate-manifests, security, docker]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Summarise and notify
        env:
          WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          BUILD: ${{ needs.build-test.result }}
          MANIFESTS: ${{ needs.validate-manifests.result }}
          SECURITY: ${{ needs.security.result }}
          IMAGES: ${{ needs.docker.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          overall=success
          for r in "${BUILD}" "${MANIFESTS}" "${SECURITY}" "${IMAGES}"; do
            [[ "${r}" == "success" || "${r}" == "skipped" ]] || overall=failure
          done
          icon=$([[ "${overall}" == success ]] && echo "✅" || echo "❌")
          {
            echo "## ${icon} CI ${overall} · ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}"
            echo
            echo "| Stage | Result |"
            echo "|---|---|"
            echo "| Build, unit + integration tests, coverage, SonarQube | ${BUILD} |"
            echo "| Kubernetes manifests | ${MANIFESTS} |"
            echo "| OWASP, Trivy, secret scan | ${SECURITY} |"
            echo "| Docker images (scan, push, sign) | ${IMAGES} |"
          } >> "${GITHUB_STEP_SUMMARY}"

          # Slack-compatible incoming webhook (Slack, Mattermost, Rocket.Chat, Discord /slack).
          if [[ -n "${WEBHOOK}" ]]; then
            # shellcheck disable=SC2016  # backticks are Slack markup, not command substitution
            text="$(printf '%s *CI %s* `%s` %s @ %s by %s\nbuild: %s · manifests: %s · security: %s · images: %s\n%s' \
              "${icon}" "${overall}" "${GITHUB_REPOSITORY}" "${GITHUB_REF_NAME}" "${GITHUB_SHA::7}" "${GITHUB_ACTOR}" \
              "${BUILD}" "${MANIFESTS}" "${SECURITY}" "${IMAGES}" "${RUN_URL}")"
            curl -fsS -X POST -H 'Content-Type: application/json' \
              --data "$(jq -n --arg t "${text}" '{text: $t}')" "${WEBHOOK}" >/dev/null \
              || echo "::warning::notification webhook failed"
          fi
          [[ "${overall}" == success ]]
